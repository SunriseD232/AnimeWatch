workflows:
  ios-unsigned:
    name: MediaWatch iOS (unsigned, для переподписи через eSign)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_SCHEME: "App"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
      node: 22.3.0
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync Capacitor iOS project
        # Проект без CocoaPods (Swift Package Manager, см. ios/App/CapApp-SPM)
        # — pod install не нужен, cap sync сам обновит зависимости плагинов
        # и capacitor.config.json внутри ios/App.
        script: npx cap sync ios
      - name: Archive without code signing
        # Никаких сертификатов/профилей/UDID Apple — итоговый .app в архиве
        # вообще не подписан. Финальную подпись под свой сертификат делает
        # eSign (сервис резайнинга) уже на телефоне/сайте пользователя, так
        # что официальный ad-hoc-провижининг (App ID, UDID, provisioning
        # profile) для этого пайплайна не нужен.
        #
        # clean + свой -derivedDataPath (внутри рабочей копии, не дефолтный
        # ~/Library/Developer/Xcode/DerivedData) — сборочная машина Codemagic
        # переиспользуется между запусками (git reset --hard в "Fetch app
        # sources", а не свежий clone), и без явной очистки инкрементальный
        # DerivedData от ПРЕДЫДУЩЕЙ сборки может пережить чекаут новых
        # файлов — archive формально проходит успешно (37с на всё — для
        # первой чистой сборки Capacitor SPM-проекта неправдоподобно быстро),
        # но новые Swift-файлы (например, нативный плагин) рискуют не
        # попасть в финальную линковку. Проверено вживую 2026-08-21: именно
        # так .ipa из формально "успешной" сборки не содержал новый
        # Capacitor-плагин, хотя коммит был свежий.
        script: |
          rm -rf build
          xcodebuild clean archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -archivePath build/ios/App.xcarchive \
            -derivedDataPath build/DerivedData \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""
      - name: Package unsigned .ipa
        # xcodebuild -exportArchive тут не подходит — он требует
        # exportOptions.plist с методом подписи/профилем, которых у нас
        # нет. Вместо этого просто упаковываем .app из архива в
        # стандартную структуру Payload/*.app внутри .ipa вручную.
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/App.xcarchive/Products/Applications/App.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -qry MediaWatch-unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - 2000gva@gmail.com
        notify:
          success: true
          failure: true

  android-tv:
    name: MediaWatch Android TV (debug, для sideload)
    max_build_duration: 30
    # Изначально стоял linux_x2 (Android сам по себе не требует Mac) — но
    # реальный запуск сборки упал мгновенно с "The selected instance type
    # is not available with the current billing plan" (см. историю сборок
    # в Codemagic, build от 2026-08-29): текущий тариф аккаунта включает
    # только mac_mini_m2 (уже используется ios-unsigned), Linux-минуты не
    # куплены отдельно. На Mac-образах Codemagic Android SDK/JDK/Gradle
    # тоже предустановлены (иначе не собрать Android рядом с iOS на одной
    # машине), так что сборка технически идентична, просто чуть дороже по
    # минутам, чем Linux был бы.
    instance_type: mac_mini_m2
    environment:
      node: 22.3.0
      # Реальный запуск (build от 2026-08-29) упал на
      # ':capacitor-android:compileDebugJavaWithJavac' с "invalid source
      # release: 21" — @capacitor/android 8.5.0 требует sourceCompatibility
      # 21 (см. node_modules/@capacitor/android/capacitor/build.gradle), а
      # дефолтный JDK на Mac-образе Codemagic младше. Явно выбираем JDK 21.
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync Capacitor Android project
        script: npx cap sync android
      - name: Build debug APK
        # assembleDebug, а не Release — в отличие от iOS (там ЛЮБАЯ сборка
        # требует что-то на выходе подписать, отсюда unsigned .ipa + eSign
        # на телефоне), Gradle сам подписывает debug-сборку встроенным
        # debug-keystore. Отдельного шага переподписи не нужно — apk сразу
        # ставится через adb install/файловый менеджер на самом TV.
        script: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - 2000gva@gmail.com
        notify:
          success: true
          failure: true
